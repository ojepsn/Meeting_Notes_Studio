[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-platform"
version = "0.1.0"
description = "Reusable agent kernel with ports/adapters, MCP-first tools, LangGraph behind a port."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Ola Jeppsson" }]
license = { text = "Proprietary" }

# --- Core runtime dependencies ---
# Keep this list narrow; anything provider- or infra-specific belongs in an extra.
dependencies = [
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.2,<3",
    "sqlalchemy>=2.0,<3",
    "aiosqlite>=0.20,<0.21",
    "alembic>=1.13,<2",
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "sse-starlette>=2.1,<3",
    "httpx>=0.27,<1",
    "typer>=0.12,<1",
    "rich>=13.7,<14",
    "python-frontmatter>=1.1,<2",  # agentskills.io format parsing
    "dependency-injector>=4.41,<5",
    "structlog>=24.1,<25",
    "tzdata",  # IANA time zone data; required on Windows for ZoneInfo
]

[project.optional-dependencies]
# --- Orchestration (LangGraph-behind-a-port adapter) ---
langgraph = [
    "langgraph>=0.2,<1",
    "langgraph-checkpoint-sqlite>=2.0,<3",
    "langchain-core>=0.3,<1",
]

# --- LLM providers. Users pick at runtime; install whichever you need. ---
anthropic = ["anthropic>=0.39,<1"]
openai = ["openai>=1.50,<2"]
ollama = ["ollama>=0.3,<1"]
openrouter = ["openai>=1.50,<2"]  # OpenRouter uses OpenAI-compatible API

# --- MCP (Model Context Protocol) client + server helpers ---
mcp = ["mcp>=1.0,<2"]

# --- Memory backends (swappable behind MemoryPort) ---
memory-letta = ["letta-client>=0.1,<1"]
memory-mem0 = ["mem0ai>=0.1,<1"]
memory-zep = ["zep-cloud>=2.0,<3"]

# --- Observability ---
langfuse = ["langfuse>=2.50,<3"]
opentelemetry = [
    "opentelemetry-api>=1.27,<2",
    "opentelemetry-sdk>=1.27,<2",
]

# --- Background work ---
queue = ["arq>=0.26,<1"]

# --- Auth adapters ---
auth-msal = ["msal>=1.30,<2"]  # Entra ID / Microsoft auth

# --- Grab-bag for local desktop-sidecar use ---
desktop = [
    "agent-platform[langgraph,anthropic,mcp]",
]

# --- Dev tooling ---
dev = [
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.23,<1",
    "pytest-cov>=5.0,<6",
    "ruff>=0.6,<1",
    "mypy>=1.11,<2",
    "types-pyyaml",
]

# Everything, for power-users or CI
all = [
    "agent-platform[langgraph,anthropic,openai,ollama,mcp,memory-letta,memory-mem0,langfuse,opentelemetry,queue,auth-msal,dev]",
]

[project.scripts]
agent-server = "agent_platform.apps.server:main"
agent-sidecar = "agent_platform.apps.sidecar:main"
agent-cli = "agent_platform.apps.cli:app"
agent-mcp-server = "agent_platform.apps.mcp_server:main"
agent-export-openapi = "agent_platform.apps.export_openapi:main"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_platform"]

# --- Ruff ---
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]  # line length handled by formatter

# --- Mypy ---
[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
# Allow missing stubs for provider libraries that lag on typing
[[tool.mypy.overrides]]
module = ["letta_client.*", "mem0.*", "zep_cloud.*", "ollama.*"]
ignore_missing_imports = true

# --- Pytest ---
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
