name: Desktop Release

on:
  push:
    tags:
      - "v0.1.*"

permissions:
  contents: write

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows-release:
    runs-on: windows-latest
    env:
      CI: true
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      GITHUB_REPOSITORY: ${{ github.repository }}
      GITHUB_REF_NAME: ${{ github.ref_name }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Validate updater signing secrets
        shell: pwsh
        run: |
          if (-not $env:TAURI_SIGNING_PRIVATE_KEY) {
            Write-Error "Missing TAURI_SIGNING_PRIVATE_KEY secret."
          }
          if (-not $env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD) {
            Write-Error "Missing TAURI_SIGNING_PRIVATE_KEY_PASSWORD secret."
          }

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: npm ci

      - name: Verify desktop release version
        run: node ./scripts/verify-desktop-release-version.mjs

      - name: Build bundled agent sidecar
        run: node ./scripts/prepare-agent-sidecar.mjs

      - name: Build signed desktop release
        run: npm run desktop:tauri:build

      - name: Prepare release assets
        run: node ./scripts/prepare-desktop-release.mjs

      - name: Show prepared release assets
        shell: pwsh
        run: |
          $releaseAssets = "apps/desktop/src-tauri/target/release/release-assets"
          if (-not (Test-Path $releaseAssets)) {
            Write-Error "Release assets directory was not created: $releaseAssets"
          }
          Get-ChildItem $releaseAssets -Recurse | Select-Object FullName, Length

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-release-${{ github.ref_name }}
          path: |
            apps/desktop/src-tauri/target/release/release-assets/latest.json
            apps/desktop/src-tauri/target/release/release-assets/latest-native.json
            apps/desktop/src-tauri/target/release/release-assets/NoteSmith.Desktop_*.exe
            apps/desktop/src-tauri/target/release/release-assets/NoteSmith.Desktop_*.exe.sig
          if-no-files-found: error

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            apps/desktop/src-tauri/target/release/release-assets/latest.json
            apps/desktop/src-tauri/target/release/release-assets/latest-native.json
            apps/desktop/src-tauri/target/release/release-assets/NoteSmith.Desktop_*.exe
            apps/desktop/src-tauri/target/release/release-assets/NoteSmith.Desktop_*.exe.sig
          fail_on_unmatched_files: true
          generate_release_notes: true
